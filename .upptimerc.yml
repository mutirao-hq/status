# Status page de todos os produtos do Mutirão (Upptime): o .upptimerc.yml do repo público
# mutirao-hq/status. Este arquivo é o ponto de partida (ver README.md ao lado); depois, as entradas
# de cada produto em `sites` são postas e tiradas pelo `pnpm product:provision` e pelo
# `product:deprovision`, que as acham pelo `slug` (<slug>-api e <slug>-worker).
owner: mutirao-hq
repo: status
user-agent: mutirao-hq

# Só estes secrets chegam aos workflows do Upptime (o GH_PAT fica de fora da lista de propósito).
secrets:
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID
  - NOTIFICATIONS_DOWN_MESSAGE
  - NOTIFICATIONS_UP_MESSAGE

# Um produto = duas linhas juntas: o site e a API (readyz, com o banco) e a batida do worker
# (workerz). 200 é no ar; qualquer outra resposta é fora do ar.
sites:
  - name: Mutirão Reference · Site e API
    slug: reference-api
    url: https://reference.mutirao.app/api/readyz
    maxResponseTime: 10000
  - name: Mutirão Reference · Tarefas em segundo plano
    slug: reference-worker
    url: https://reference.mutirao.app/api/workerz
    maxResponseTime: 10000
  - name: NestMatch · Site e API
    slug: nestmatch-api
    url: https://nestmatch.mutirao.app/api/readyz
    maxResponseTime: 10000
  - name: NestMatch · Tarefas em segundo plano
    slug: nestmatch-worker
    url: https://nestmatch.mutirao.app/api/workerz
    maxResponseTime: 10000

# Incidente que se resolve em menos de 15 minutos some do histórico (padrão do Upptime).
skipDeleteIssues: false

commitMessages:
  readmeContent: ":pencil: Atualiza o resumo no README [skip ci] [upptime]"
  summaryJson: ":card_file_box: Atualiza o resumo de status [skip ci] [upptime]"
  statusChange: "$EMOJI $SITE_NAME: $STATUS ($RESPONSE_CODE em $RESPONSE_TIME ms)
    [skip ci] [upptime]"
  graphsUpdate: ":bento: Atualiza os gráficos [skip ci] [upptime]"

status-website:
  cname: status.mutirao.app
  name: Status do Mutirão
  theme: light
  introTitle: "**Status dos produtos do Mutirão**"
  introMessage: Conferimos cada produto a cada 5 minutos. Incidentes e manutenções
    programadas aparecem abaixo.
  navbar:
    - title: Status
      href: /

